<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in — Linkfolio</title>
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="brand">Linkfolio</a>
    <h1 class="mt-2" data-content="title">Welcome back</h1>
    <p class="sub" data-content="subtitle">Sign in to manage your links</p>

    <div id="alertBox" aria-live="polite"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email"
               autocomplete="email" required
               data-content-placeholder="email_placeholder"
               placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password"
               autocomplete="current-password" required
               data-content-placeholder="password_placeholder"
               placeholder="Your password" />
      </div>
      <div class="flex-between mb-2">
        <label class="flex" style="align-items:center;gap:6px;font-size:13px;color:var(--muted)">
          <input type="checkbox" id="remember" /> Remember me
        </label>
        <a href="forgot-password.html" style="font-size:13px">Forgot password?</a>
      </div>
      <button class="btn block" type="submit" id="submitBtn" data-content="button">Sign in</button>
    </form>

    <p class="text-center mt-3 muted">
      New here? <a href="signup.html">Create an account</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { sb, $, showAlert, clearAlert, setLoading, friendlyError, getSession, validateEmail, loadSiteContent, applyContent } = App;
  const alertBox = $('#alertBox');
  const form = $('#loginForm');
  const btn = $('#submitBtn');

  const content = await loadSiteContent('login');
  applyContent(content);

  // Already authenticated → dashboard
  const existing = await getSession();
  if (existing) { window.location.replace('dashboard.html'); return; }

  // Prefill email from reset-password flows
  const params = new URLSearchParams(location.search);
  if (params.get('email')) $('#email').value = params.get('email');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);
    const email = validateEmail($('#email').value);
    if (!email.ok) return showAlert(alertBox, 'error', email.msg);
    const password = $('#password').value;
    if (!password) return showAlert(alertBox, 'error', 'Password required');

    setLoading(btn, true, 'Signing in…');
    try {
      const { data, error } = await sb.auth.signInWithPassword({
        email: email.value, password
      });
      if (error) throw error;
      if (!data.session) throw new Error('No session returned');
      showAlert(alertBox, 'success', 'Signed in! Redirecting…');
      window.location.replace('dashboard.html');
    } catch (err) {
      showAlert(alertBox, 'error', friendlyError(err));
      setLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
