<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — LinkBio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">🔗 LinkBio</a>
  <div class="nav-links"><a class="btn btn-ghost btn-sm" href="signup.html">Sign up</a></div>
</nav>

<div class="auth-wrap">
  <div class="card auth-card">
    <h2 data-content="heading">Welcome back</h2>
    <p data-content="subheading">Log in to manage your page.</p>

    <div id="alert-box"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
    </form>

    <div class="auth-links">
      <a href="forgot-password.html">Forgot password?</a><br>
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  redirectIfLoggedIn();

  (async () => {
    const content = await loadSiteContent("login", {
      heading: "Welcome back",
      subheading: "Log in to manage your page.",
    });
    applyTextContent(content);
  })();

  const form = document.getElementById("login-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    renderAlert(alertBox, "");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!isValidEmail(email)) {
      renderAlert(alertBox, "Please enter a valid email address.");
      return;
    }
    if (!password) {
      renderAlert(alertBox, "Please enter your password.");
      return;
    }

    setButtonLoading(submitBtn, true, "Logging in…");
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    setButtonLoading(submitBtn, false);

    if (error) {
      renderAlert(alertBox, friendlyError(error));
      return;
    }
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
