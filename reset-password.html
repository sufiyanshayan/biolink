<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — LinkBio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">🔗 LinkBio</a>
</nav>

<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Set a new password</h2>
    <div id="alert-box"></div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" required>
        <div class="field-hint">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Update password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const alertBox = document.getElementById("alert-box");
  const form = document.getElementById("reset-form");
  const submitBtn = document.getElementById("submit-btn");
  let readyForReset = false;

  // Supabase sends the recovery token in the URL; the SDK exchanges it
  // for a temporary session and fires PASSWORD_RECOVERY.
  supabase.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      readyForReset = true;
    }
  });

  (async () => {
    const session = await getSession();
    if (session) readyForReset = true;
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    renderAlert(alertBox, "");

    if (!readyForReset) {
      renderAlert(alertBox, "This reset link is invalid or has expired. Please request a new one.");
      return;
    }

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (!isValidPassword(password)) {
      renderAlert(alertBox, "Password must be at least 8 characters.");
      return;
    }
    if (password !== confirm) {
      renderAlert(alertBox, "Passwords do not match.");
      return;
    }

    setButtonLoading(submitBtn, true, "Updating…");
    const { error } = await supabase.auth.updateUser({ password });
    setButtonLoading(submitBtn, false);

    if (error) {
      renderAlert(alertBox, friendlyError(error));
      return;
    }
    renderAlert(alertBox, "Password updated! Redirecting to login…", "success");
    await supabase.auth.signOut();
    setTimeout(() => (window.location.href = "login.html"), 1500);
  });
</script>
</body>
</html>
