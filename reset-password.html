<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Password | BioLink</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>

   BIOLINK GLOBAL STYLES (shared by every page)
   ============================================================================ */

.glass-panel { background: rgba(255,255,255,.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.1); }
.glass-panel-dark { background: rgba(15,15,15,.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.04); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(156,163,175,.25); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(156,163,175,.45); }

@keyframes scaleIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
@keyframes fadeIn  { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.animate-scale-in { animation: scaleIn .2s cubic-bezier(.16,1,.3,1) forwards; }
.animate-fade-in  { animation: fadeIn .25s ease-out both; }

.dragging-item, .sortable-ghost { opacity: .5; background-color: rgba(99,102,241,.15) !important; border-color: rgb(99,102,241) !important; }
.unboxed-meta-item + .unboxed-meta-item::before { content: "·"; margin: 0 .5rem; color: currentColor; opacity: .5; }

input:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }

/* Utilities missing from the Tailwind CDN build */
.text-wrap-balance { text-wrap: balance; }
.border-3 { border-width: 3px; }
.qrcode-container canvas, .qrcode-container img { display: block; margin: 0 auto; max-width: 100%; height: auto; }

/* Public-profile / preview theme engine (values set by applyProfileTheme in app.js) */
.theme-text-primary { color: var(--t-text, #fff); }
.theme-text-muted   { color: var(--t-text, #fff); opacity: .75; }
.theme-btn {
  background: var(--t-btn-bg, #fff);
  color: var(--t-btn-text, #0f172a);
  border-radius: var(--t-radius, 12px);
  text-decoration: none;
}

/* Demo-mode banner */
#demo-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 60; background: #fef3c7; color: #78350f; font-size: 12px; font-weight: 600; text-align: center; padding: 6px 12px; }
body.has-demo-banner { padding-top: 30px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col antialiased">

  <header class="w-full bg-transparent">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
      <a href="index.html" class="text-xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
        <span class="bg-black text-white px-2 py-1 rounded-md text-sm font-black">B</span>
        <span>BioLink</span>
      </a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">
      
      <div class="text-center space-y-2">
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">
          Create New Password
        </h1>
        <p class="text-sm text-slate-500">
          Enter your new password below to update and secure your account credentials.
        </p>
      </div>

      <div id="alert-box" class="hidden rounded-xl p-3 text-sm font-medium"></div>

      <form id="reset-form" class="space-y-4">
        <div class="space-y-1">
          <label for="password" class="text-xs font-semibold uppercase text-slate-500 tracking-wider">New Password</label>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="Min. 8 characters"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all"
          >
        </div>

        <div class="space-y-1">
          <label for="confirm-password" class="text-xs font-semibold uppercase text-slate-500 tracking-wider">Confirm New Password</label>
          <input 
            type="password" 
            id="confirm-password" 
            required 
            placeholder="••••••••"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all"
          >
        </div>

        <button 
          type="submit" 
          id="submit-btn"
          class="w-full bg-black hover:bg-slate-800 text-white font-semibold text-sm py-3 rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
        >
          <span id="btn-text">Update Password</span>
          <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        </button>
      </form>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-400">
    &copy; 2026 BioLink SaaS. Built securely with Supabase.
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      checkSupabaseConnection();

      // Clicking the e-mail link makes supabase-js create a recovery session automatically.
      if (isSupabaseConfigured()) {
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const { data: { session } } = await supabase.auth.getSession();
        if (!session || hashParams.get('error')) {
          showToast('This recovery link is invalid or has expired. Please request a new one.', 'error');
          setTimeout(() => { window.location.href = 'forgot-password.html'; }, 3000);
        }
      }

      const form = document.getElementById('reset-form');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const alertBox = document.getElementById('alert-box');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (password.length < 8) {
          showToast('Password must be at least 8 characters long', 'error');
          return;
        }

        if (password !== confirmPassword) {
          showToast('Passwords do not match', 'error');
          return;
        }

        alertBox.className = 'hidden';
        alertBox.innerText = '';
        submitBtn.disabled = true;
        btnText.innerText = 'Updating password...';
        btnSpinner.classList.remove('hidden');

        try {
          if (isSupabaseConfigured()) {
            const { error } = await supabase.auth.updateUser({
              password: password
            });

            if (error) throw error;
            await supabase.auth.signOut({ scope: 'local' });

            alertBox.className = 'bg-emerald-50 text-emerald-800 border border-emerald-100 rounded-xl p-3 text-sm font-medium';
            alertBox.innerText = '✓ Password updated successfully! Redirecting to login...';
            showToast('Password updated!');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2000);
          } else {
            // Demo mode simulation
            localStorage.setItem('demo_registered_password', password);
            alertBox.className = 'bg-emerald-50 text-emerald-800 border border-emerald-100 rounded-xl p-3 text-sm font-medium';
            alertBox.innerText = '✓ [Demo Mode] Password updated! Redirecting to login...';
            showToast('Password updated in Demo Mode!');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2000);
          }
        } catch (error) {
          console.error(error);
          alertBox.className = 'bg-rose-50 text-rose-800 border border-rose-100 rounded-xl p-3 text-sm font-medium';
          alertBox.innerText = error.message || 'Failed to reset password. Please try again.';
          showToast(error.message || 'Reset failed', 'error');
          
          submitBtn.disabled = false;
          btnText.innerText = 'Update Password';
          btnSpinner.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
