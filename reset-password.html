<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Set new password — Linkfolio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="brand">Linkfolio</a>
    <h1 class="mt-2">Choose a new password</h1>
    <p class="sub">Pick something strong you haven't used before.</p>

    <div id="alertBox" aria-live="polite"></div>

    <form id="rpForm" novalidate>
      <div class="form-group">
        <label class="label" for="password">New password</label>
        <input class="input" type="password" id="password" required
               autocomplete="new-password" minlength="8" placeholder="At least 8 characters" />
      </div>
      <div class="form-group">
        <label class="label" for="confirm">Confirm password</label>
        <input class="input" type="password" id="confirm" required
               autocomplete="new-password" placeholder="Repeat password" />
      </div>
      <button class="btn block" type="submit" id="submitBtn">Update password</button>
    </form>
    <p class="text-center mt-3 muted"><a href="login.html">Back to sign in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { sb, $, showAlert, clearAlert, setLoading, friendlyError, validatePassword, getSession } = App;
  const alertBox = $('#alertBox');
  const form = $('#rpForm');
  const btn = $('#submitBtn');

  // Supabase places recovery token in URL hash; SDK auto-detects it
  // and creates a temporary session. Wait briefly for it.
  let session = await getSession();
  if (!session) {
    await new Promise(r => setTimeout(r, 800));
    session = await getSession();
  }
  if (!session) {
    showAlert(alertBox, 'error',
      'Invalid or expired reset link. Please request a new one.');
    btn.disabled = true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);
    const pw = validatePassword($('#password').value);
    if (!pw.ok) return showAlert(alertBox, 'error', pw.msg);
    if ($('#password').value !== $('#confirm').value)
      return showAlert(alertBox, 'error', 'Passwords do not match');

    setLoading(btn, true, 'Updating…');
    try {
      const { error } = await sb.auth.updateUser({ password: $('#password').value });
      if (error) throw error;
      showAlert(alertBox, 'success', 'Password updated. Redirecting to sign in…');
      setTimeout(async () => {
        await sb.auth.signOut();
        window.location.replace('login.html');
      }, 900);
    } catch (err) {
      showAlert(alertBox, 'error', friendlyError(err));
      setLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
