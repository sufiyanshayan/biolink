<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Profile — Linkfolio</title>
<meta name="description" id="metaDesc" content="A Linkfolio profile." />
<meta property="og:title" id="ogTitle" content="Linkfolio" />
<meta property="og:description" id="ogDesc" content="A Linkfolio profile." />
<meta property="og:image" id="ogImage" content="" />
<meta property="og:url" id="ogUrl" content="" />
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600&family=Roboto:wght@400;500&family=Lora:wght@400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
  .profile-page { background: var(--pf-bg, #0f172a); font-family: var(--pf-font, 'Inter', sans-serif); }
  .profile-card {
    background: var(--pf-card, #fff);
    color: var(--pf-text, #0f172a);
    border-radius: var(--pf-radius, 16px);
  }
  .public-link {
    background: var(--pf-accent, #6366f1);
    color: #fff;
    border-radius: var(--pf-radius, 16px);
  }
  .public-link[data-style="outline"] {
    background: transparent;
    color: var(--pf-accent, #6366f1);
    border: 2px solid var(--pf-accent, #6366f1);
  }
  .public-link[data-style="soft"] {
    background: color-mix(in srgb, var(--pf-accent, #6366f1) 18%, #fff);
    color: var(--pf-accent, #6366f1);
  }
</style>
</head>
<body>
<div class="profile-page" id="profileRoot">
  <div id="profileCard" class="profile-card hidden">
    <img id="pAvatar" class="profile-avatar" alt="" />
    <h1 class="profile-name" id="pName"></h1>
    <div class="profile-handle" id="pHandle"></div>
    <p class="profile-bio" id="pBio"></p>
    <div class="public-links" id="pLinks"></div>
  </div>

  <div id="messageBox" class="profile-card hidden" style="max-width:520px;padding:32px;text-align:center">
    <h1 style="margin:0 0 8px;font-size:20px" id="msgTitle"></h1>
    <p style="margin:0;opacity:.75" id="msgBody"></p>
    <a href="index.html" class="btn mt-3">Create your own</a>
  </div>

  <footer style="margin-top:32px;opacity:.7;font-size:12px;color:#fff">
    <a href="index.html" style="color:inherit">Powered by Linkfolio</a>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const {
    sb, el, clear, $, escapeHtml, applyTheme, DEFAULT_THEME
  } = App;

  // Resolve username from ?u= OR /username rewrite (?u=username)
  const params = new URLSearchParams(location.search);
  let username = params.get('u');

  // Fallback: /username path (when host rewrites to profile.html?u=username this is already set)
  if (!username) {
    const seg = location.pathname.split('/').filter(Boolean).pop() || '';
    if (seg && seg !== 'profile.html') username = seg;
  }

  if (!username) {
    document.title = 'Profile not found — Linkfolio';
    document.getElementById('msgTitle').textContent = 'Profile not found';
    document.getElementById('msgBody').textContent = 'No profile was specified.';
    document.getElementById('messageBox').classList.remove('hidden');
    return;
  }

  username = decodeURIComponent(username).toLowerCase();

  try {
    const { data, error } = await sb.rpc('get_public_profile', { p_username: username });
    if (error) throw error;

    if (!data || data.status === 'not_found') {
      document.title = 'Profile not found — Linkfolio';
      document.getElementById('msgTitle').textContent = 'Profile not found';
      document.getElementById('msgBody').textContent = `The username “${username}” doesn’t exist.`;
      document.getElementById('messageBox').classList.remove('hidden');
      return;
    }
    if (data.status === 'blocked') {
      document.title = 'Profile unavailable — Linkfolio';
      document.getElementById('msgTitle').textContent = 'Profile unavailable';
      document.getElementById('msgBody').textContent = 'This profile is currently unavailable.';
      document.getElementById('messageBox').classList.remove('hidden');
      return;
    }

    const p = data.profile;
    const theme = Object.assign({}, DEFAULT_THEME, p.theme || {});

    // Apply theme
    applyTheme(document.getElementById('profileRoot'), theme);
    document.body.style.background = getComputedStyle(document.getElementById('profileRoot')).background;

    // Fill content
    const avatar = p.avatar_url || window.__APP_CONFIG__.DEFAULT_AVATAR;
    document.getElementById('pAvatar').src = avatar;
    document.getElementById('pAvatar').alt = (p.display_name || p.username) + ' avatar';
    document.getElementById('pName').textContent = p.display_name || '@' + p.username;
    document.getElementById('pHandle').textContent = '@' + p.username;
    document.getElementById('pBio').textContent = p.bio || '';

    // Build links (safe DOM, no innerHTML with user data)
    const linksWrap = document.getElementById('pLinks');
    clear(linksWrap);
    const links = data.links || [];
    if (!links.length) {
      linksWrap.appendChild(el('p', { class: 'muted', text: 'No links yet.', attrs: { style: 'text-align:center' } }));
    }
    links.forEach(link => {
      const a = el('a', {
        class: 'public-link',
        text: link.title,
        attrs: {
          href: '#',
          rel: 'noopener noreferrer',
          'data-link-id': link.id,
          'data-style': theme.button_style || 'filled'
        }
      });
      a.addEventListener('click', async (e) => {
        e.preventDefault();
        // Track via RPC, then navigate
        try {
          const { data: url } = await sb.rpc('track_link_click', { p_link_id: link.id });
          window.location.href = url || link.url;
        } catch {
          window.location.href = link.url;
        }
      });
      linksWrap.appendChild(a);
    });

    // SEO
    const profileUrl = App.publicProfileUrl(p.username);
    const title = `${p.display_name || p.username} (@${p.username}) — Linkfolio`;
    const desc = (p.bio || `Check out all the links from ${p.display_name || p.username} on Linkfolio.`).slice(0, 160);
    document.title = title;
    document.getElementById('metaDesc').setAttribute('content', desc);
    document.getElementById('ogTitle').setAttribute('content', title);
    document.getElementById('ogDesc').setAttribute('content', desc);
    document.getElementById('ogImage').setAttribute('content', p.avatar_url || '');
    document.getElementById('ogUrl').setAttribute('content', profileUrl);
    const ogImgTag = document.createElement('meta');
    ogImgTag.setAttribute('property', 'og:image');
    ogImgTag.setAttribute('content', p.avatar_url || '');
    document.head.appendChild(ogImgTag);

    document.getElementById('profileCard').classList.remove('hidden');

    // Track view (fire-and-forget; ignore errors)
    sb.rpc('track_profile_view', { p_username: p.username }).catch(() => {});
  } catch (err) {
    console.error(err);
    document.getElementById('msgTitle').textContent = 'Profile unavailable';
    document.getElementById('msgBody').textContent = 'Something went wrong loading this profile.';
    document.getElementById('messageBox').classList.remove('hidden');
  }
})();
</script>
</body>
</html>
