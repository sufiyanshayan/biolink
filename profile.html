<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Loading… — LinkBio</title>
<meta id="meta-description" name="description" content="">
<meta id="og-title" property="og:title" content="">
<meta id="og-description" property="og:description" content="">
<meta id="og-image" property="og:image" content="">
<meta id="og-url" property="og:url" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root{ --p-bg:#0b0f19; --p-card:#141a29; --p-text:#f1f5f9; --p-accent:#6366f1; --p-radius:16px; --p-font:"Inter",sans-serif; }
  .profile-page{ background:var(--p-bg); color:var(--p-text); font-family:var(--p-font); }
  .profile-link{ background:var(--p-card); color:var(--p-text); border-radius:var(--p-radius); }
  body[data-button-style="outline"] .profile-link{ background:transparent; border:2px solid var(--p-accent); }
  body[data-button-style="soft"] .profile-link{ background:color-mix(in srgb, var(--p-accent) 18%, var(--p-card)); }
  body[data-button-style="solid"] .profile-link{ background:var(--p-accent); }
</style>
</head>
<body>

<div id="root">
  <div class="center-loading"><span class="spinner spinner-dark"></span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
function getUsernameFromUrl() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("u")) return params.get("u").toLowerCase();
  // Pretty URL fallback: /username served as this file by hosting rewrite rules.
  const segments = window.location.pathname.split("/").filter(Boolean);
  const last = segments[segments.length - 1] || "";
  if (last && last !== "profile.html") return last.toLowerCase();
  return "";
}

function renderNotFound() {
  document.getElementById("root").innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "profile-page";
  wrap.innerHTML = `<div class="profile-error"><h2>Profile not found</h2><p>This page doesn't exist.</p></div>`;
  document.getElementById("root").appendChild(wrap);
}

function renderUnavailable() {
  document.getElementById("root").innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "profile-page";
  wrap.innerHTML = `<div class="profile-error"><h2>Profile unavailable</h2><p>This profile is currently unavailable.</p></div>`;
  document.getElementById("root").appendChild(wrap);
}

async function render() {
  const username = getUsernameFromUrl();
  if (!isValidUsername(username)) {
    renderNotFound();
    return;
  }

  const { data: rows, error } = await supabase.rpc("get_public_profile", { p_username: username });
  const profile = rows && rows[0];

  if (error || !profile) {
    renderNotFound();
    return;
  }
  if (profile.is_blocked) {
    renderUnavailable();
    return;
  }

  applyThemeToProfilePage(profile.theme);

  document.getElementById("page-title").textContent = `${profile.display_name || profile.username} — LinkBio`;
  const desc = profile.bio || `Check out ${profile.display_name || profile.username}'s links.`;
  document.getElementById("meta-description").setAttribute("content", desc);
  document.getElementById("og-title").setAttribute("content", profile.display_name || profile.username);
  document.getElementById("og-description").setAttribute("content", desc);
  document.getElementById("og-image").setAttribute("content", profile.avatar_url || "");
  document.getElementById("og-url").setAttribute("content", profileUrlFor(profile.username));

  const { data: links } = await supabase
    .from("links")
    .select("id,title,url,position")
    .eq("user_id", profile.id)
    .eq("is_active", true)
    .order("position", { ascending: true });

  const root = document.getElementById("root");
  root.innerHTML = "";
  const page = document.createElement("div");
  page.className = "profile-page";

  const avatar = document.createElement("img");
  avatar.className = "profile-avatar";
  avatar.alt = profile.display_name || profile.username;
  avatar.src = profile.avatar_url || ("data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="100%" height="100%" fill="#1c2438"/><text x="50%" y="55%" font-size="40" text-anchor="middle" fill="#94a3b8" font-family="sans-serif">?</text></svg>`
  ));

  const name = document.createElement("div");
  name.className = "profile-name";
  name.textContent = profile.display_name || profile.username;

  const uname = document.createElement("div");
  uname.className = "profile-username";
  uname.textContent = "@" + profile.username;

  page.append(avatar, name, uname);

  if (profile.bio) {
    const bio = document.createElement("div");
    bio.className = "profile-bio";
    bio.textContent = profile.bio;
    page.appendChild(bio);
  }

  const linksWrap = document.createElement("div");
  linksWrap.className = "profile-links";

  if (!links || !links.length) {
    const empty = document.createElement("div");
    empty.className = "profile-empty";
    empty.textContent = "No links yet.";
    linksWrap.appendChild(empty);
  } else {
    links.forEach((link) => {
      const a = document.createElement("a");
      a.className = "profile-link";
      a.href = "#";
      a.textContent = link.title;
      a.addEventListener("click", async (e) => {
        e.preventDefault();
        const { data: destUrl } = await supabase.rpc("record_link_click", { p_link_id: link.id });
        window.open(destUrl || link.url, "_blank", "noopener");
      });
      linksWrap.appendChild(a);
    });
  }
  page.appendChild(linksWrap);

  const footer = document.createElement("div");
  footer.className = "profile-footer";
  const madeWith = document.createElement("a");
  madeWith.href = "index.html";
  madeWith.style.fontSize = ".8rem";
  madeWith.style.color = "var(--p-text)";
  madeWith.style.opacity = ".6";
  madeWith.textContent = "Made with LinkBio";
  footer.appendChild(madeWith);
  page.appendChild(footer);

  root.appendChild(page);

  supabase.rpc("record_profile_view", { p_username: profile.username });
}

render();
</script>
</body>
</html>
