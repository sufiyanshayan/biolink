<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Forgot password — Linkfolio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="brand">Linkfolio</a>
    <h1 class="mt-2">Reset your password</h1>
    <p class="sub">We'll email you a secure link to set a new password.</p>

    <div id="alertBox" aria-live="polite"></div>

    <form id="fpForm" novalidate>
      <div class="form-group">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" required
               autocomplete="email" placeholder="you@example.com" />
      </div>
      <button class="btn block" type="submit" id="submitBtn">Send reset link</button>
    </form>

    <p class="text-center mt-3 muted">
      <a href="login.html">Back to sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const { sb, $, showAlert, clearAlert, setLoading, friendlyError, validateEmail } = App;
  const alertBox = $('#alertBox');
  const form = $('#fpForm');
  const btn = $('#submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);
    const em = validateEmail($('#email').value);
    if (!em.ok) return showAlert(alertBox, 'error', em.msg);

    setLoading(btn, true, 'Sending…');
    try {
      const redirectTo = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}reset-password.html`;
      const { error } = await sb.auth.resetPasswordForEmail(em.value, { redirectTo });
      if (error) throw error;
      showAlert(alertBox, 'success',
        'If an account exists for that email, a reset link has been sent.');
      form.reset();
    } catch (err) {
      showAlert(alertBox, 'error', friendlyError(err));
    } finally {
      setLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
