<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — LinkBio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">🔗 LinkBio</a>
  <div class="nav-links"><a class="btn btn-ghost btn-sm" href="login.html">Log in</a></div>
</nav>

<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Forgot your password?</h2>
    <p>Enter your email and we'll send you a reset link.</p>

    <div id="alert-box"></div>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset link</button>
    </form>

    <div class="auth-links"><a href="login.html">Back to log in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const form = document.getElementById("forgot-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    renderAlert(alertBox, "");
    const email = document.getElementById("email").value.trim();
    if (!isValidEmail(email)) {
      renderAlert(alertBox, "Please enter a valid email address.");
      return;
    }
    setButtonLoading(submitBtn, true, "Sending…");
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: `${window.APP_CONFIG.SITE_URL}/reset-password.html`,
    });
    setButtonLoading(submitBtn, false);

    // Always show the same success message, whether or not the email
    // exists, so the form can't be used to enumerate registered emails.
    if (error && !error.message.toLowerCase().includes("rate")) {
      renderAlert(alertBox, "If an account exists for that email, a reset link has been sent.", "success");
    } else if (error) {
      renderAlert(alertBox, "Too many attempts. Please wait a moment and try again.");
    } else {
      renderAlert(alertBox, "If an account exists for that email, a reset link has been sent.", "success");
    }
    form.reset();
  });
</script>
</body>
</html>
