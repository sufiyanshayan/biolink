<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin panel — Linkfolio</title>
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="container dash-header">
  <a href="admin-panel.html" class="brand">Linkfolio · Admin</a>
  <div class="flex-gap">
    <a href="index.html" class="btn ghost small" target="_blank" rel="noopener">Site</a>
    <button id="logoutBtn" class="btn ghost small">Log out</button>
  </div>
</header>

<main class="container">
  <div id="globalAlert" aria-live="polite"></div>

  <section class="stats-grid mb-2">
    <div class="stat"><div class="n" id="sUsers">–</div><div class="l">Users</div></div>
    <div class="stat"><div class="n" id="sBlocked">–</div><div class="l">Blocked</div></div>
    <div class="stat"><div class="n" id="sLinks">–</div><div class="l">Links</div></div>
    <div class="stat"><div class="n" id="sViews">–</div><div class="l">Profile views</div></div>
    <div class="stat"><div class="n" id="sClicks">–</div><div class="l">Link clicks</div></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="users" role="tab">Users</button>
    <button class="tab" data-tab="content" role="tab">Site content</button>
  </div>

  <!-- Users tab -->
  <section id="tab-users" class="card">
    <div class="flex-between mb-2">
      <h2 style="margin:0;font-size:16px">User management</h2>
      <input class="input" id="userSearch" placeholder="Search username/email…" style="max-width:260px" />
    </div>
    <div id="usersAlert" aria-live="polite"></div>
    <div id="usersList"></div>
    <div class="flex-between mt-2">
      <button class="btn secondary small" id="prevPage">← Prev</button>
      <span class="muted" id="pageInfo"></span>
      <button class="btn secondary small" id="nextPage">Next →</button>
    </div>
  </section>

  <!-- Content tab -->
  <section id="tab-content" class="card hidden">
    <h2 style="margin:0 0 14px;font-size:16px">Site content</h2>
    <div id="contentAlert" aria-live="polite"></div>
    <div class="flex-gap mb-2">
      <select class="select" id="pageSelect" style="max-width:220px">
        <option value="index">index</option>
        <option value="login">login</option>
        <option value="signup">signup</option>
      </select>
      <button class="btn small" id="addContentBtn">Add / update key</button>
    </div>
    <div id="contentList"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const {
    sb, el, clear, $, $$, requireAdmin, showAlert, clearAlert,
    setLoading, friendlyError, debounce
  } = App;

  const session = await requireAdmin();
  if (!session) return;

  const globalAlert = $('#globalAlert');

  /* ---------- Stats ---------- */
  async function loadStats() {
    try {
      const [users, blocked, links, views, clicks] = await Promise.all([
        sb.from('profiles').select('id', { count: 'exact', head: true }),
        sb.from('profiles').select('id', { count: 'exact', head: true }).eq('is_blocked', true),
        sb.from('links').select('id', { count: 'exact', head: true }),
        sb.from('profile_views').select('id', { count: 'exact', head: true }),
        sb.from('link_clicks').select('id', { count: 'exact', head: true })
      ]);
      $('#sUsers').textContent = users.count ?? 0;
      $('#sBlocked').textContent = blocked.count ?? 0;
      $('#sLinks').textContent = links.count ?? 0;
      $('#sViews').textContent = views.count ?? 0;
      $('#sClicks').textContent = clicks.count ?? 0;
    } catch (e) {
      console.warn(e);
    }
  }

  /* ---------- Tabs ---------- */
  $$('.tab').forEach(t => t.addEventListener('click', () => {
    $$('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const which = t.getAttribute('data-tab');
    $('#tab-users').classList.toggle('hidden', which !== 'users');
    $('#tab-content').classList.toggle('hidden', which !== 'content');
  }));

  /* ---------- Users list ---------- */
  const PAGE_SIZE = 15;
  let page = 0;
  let search = '';
  let totalUsers = 0;

  async function loadUsers() {
    const list = $('#usersList');
    clear(list);
    list.appendChild(el('p', { class: 'muted', text: 'Loading…' }));
    try {
      let q = sb.from('profiles')
        .select('id,username,email,display_name,is_blocked,created_at', { count: 'exact' })
        .order('created_at', { ascending: false })
        .range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
      if (search) q = q.or(`username.ilike.%${search}%,email.ilike.%${search}%`);
      const { data, error, count } = await q;
      if (error) throw error;
      totalUsers = count || 0;
      clear(list);
      if (!data || !data.length) {
        list.appendChild(el('p', { class: 'muted', text: 'No users found.' }));
      } else {
        // Load link counts per user in one query
        const ids = data.map(u => u.id);
        const { data: linkRows } = await sb.from('links')
          .select('user_id').in('user_id', ids);
        const linkCounts = {};
        (linkRows || []).forEach(r => {
          linkCounts[r.user_id] = (linkCounts[r.user_id] || 0) + 1;
        });

        data.forEach(u => list.appendChild(renderUserRow(u, linkCounts[u.id] || 0)));
      }
      const pages = Math.max(1, Math.ceil(totalUsers / PAGE_SIZE));
      $('#pageInfo').textContent = `Page ${page + 1} / ${pages} · ${totalUsers} users`;
      $('#prevPage').disabled = page === 0;
      $('#nextPage').disabled = (page + 1) * PAGE_SIZE >= totalUsers;
    } catch (e) {
      clear(list);
      showAlert($('#usersAlert'), 'error', friendlyError(e));
    }
  }

  function renderUserRow(u, linkCount) {
    const row = el('div', { class: 'user-row' });
    const info = el('div', { class: 'info' }, [
      el('strong', { text: '@' + u.username + (u.display_name ? ' · ' + u.display_name : '') }),
      el('small', { text: u.email }),
      el('small', { text: `${linkCount} links · joined ${new Date(u.created_at).toLocaleDateString()}` }),
      el('small', {
        text: u.is_blocked ? 'Status: BLOCKED' : 'Status: Active',
        class: u.is_blocked ? '' : 'muted'
      })
    ]);
    const actions = el('div', { class: 'actions flex-gap' });
    actions.appendChild(el('a', {
      class: 'btn small secondary', text: 'Profile',
      attrs: { href: `profile.html?u=${encodeURIComponent(u.username)}`, target: '_blank', rel: 'noopener' }
    }));
    actions.appendChild(el('button', {
      class: 'btn small ' + (u.is_blocked ? '' : 'danger'),
      text: u.is_blocked ? 'Unblock' : 'Block',
      on: { click: () => toggleBlock(u.id, !u.is_blocked) }
    }));
    row.appendChild(info);
    row.appendChild(actions);
    return row;
  }

  async function toggleBlock(id, val) {
    clearAlert($('#usersAlert'));
    try {
      const { error } = await sb.from('profiles').update({ is_blocked: val }).eq('id', id);
      if (error) throw error;
      showAlert($('#usersAlert'), 'success', val ? 'User blocked' : 'User unblocked');
      await loadUsers(); await loadStats();
    } catch (e) {
      showAlert($('#usersAlert'), 'error', friendlyError(e));
    }
  }

  $('#userSearch').addEventListener('input', debounce((e) => {
    search = e.target.value.trim();
    page = 0;
    loadUsers();
  }, 350));

  $('#prevPage').addEventListener('click', () => { if (page > 0) { page--; loadUsers(); } });
  $('#nextPage').addEventListener('click', () => {
    if ((page + 1) * PAGE_SIZE < totalUsers) { page++; loadUsers(); }
  });

  /* ---------- Site content ---------- */
  async function loadContent(pageKey) {
    const list = $('#contentList');
    clear(list);
    list.appendChild(el('p', { class: 'muted', text: 'Loading…' }));
    try {
      const { data, error } = await sb.from('site_content')
        .select('*').eq('page_key', pageKey).order('content_key');
      if (error) throw error;
      clear(list);
      if (!data || !data.length) {
        list.appendChild(el('p', { class: 'muted', text: 'No content for this page yet.' }));
        return;
      }
      data.forEach(row => list.appendChild(renderContentRow(row)));
    } catch (e) {
      clear(list);
      showAlert($('#contentAlert'), 'error', friendlyError(e));
    }
  }

  function renderContentRow(row) {
    const wrap = el('div', { class: 'card', attrs: { style: 'margin-bottom:10px' } });
    wrap.appendChild(el('div', {
      class: 'muted',
      attrs: { style: 'font-size:12px;margin-bottom:6px' },
      text: `${row.page_key}.${row.content_key}`
    }));
    const ta = el('textarea', {
      class: 'textarea',
      attrs: { rows: 3, 'data-key': row.content_key }
    });
    ta.value = row.content_value;
    wrap.appendChild(ta);
    wrap.appendChild(el('div', {
      class: 'flex-gap mt-2',
      attrs: { style: '' }
    }, [
      el('button', {
        class: 'btn small', text: 'Save',
        on: { click: async (e) => {
          const btn = e.currentTarget;
          setLoading(btn, true, 'Saving…');
          try {
            const { error } = await sb.from('site_content')
              .update({ content_value: ta.value })
              .eq('page_key', row.page_key).eq('content_key', row.content_key);
            if (error) throw error;
            showAlert($('#contentAlert'), 'success', 'Saved');
          } catch (err) {
            showAlert($('#contentAlert'), 'error', friendlyError(err));
          } finally { setLoading(btn, false); }
        }}
      })
    ]));
    return wrap;
  }

  $('#pageSelect').addEventListener('change', (e) => loadContent(e.target.value));

  $('#addContentBtn').addEventListener('click', async () => {
    clearAlert($('#contentAlert'));
    const pageKey = $('#pageSelect').value;
    const key = prompt('Content key (e.g. hero_title):');
    if (!key) return;
    const value = prompt('Content value:') || '';
    if (!/^[a-z0-9_]{1,64}$/i.test(key))
      return showAlert($('#contentAlert'), 'error', 'Key must be alphanumeric/underscore');
    try {
      const { error } = await sb.from('site_content')
        .upsert({ page_key: pageKey, content_key: key, content_value: value },
                { onConflict: 'page_key,content_key' });
      if (error) throw error;
      showAlert($('#contentAlert'), 'success', 'Saved');
      await loadContent(pageKey);
    } catch (e) {
      showAlert($('#contentAlert'), 'error', friendlyError(e));
    }
  });

  /* ---------- Logout ---------- */
  $('#logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.replace('admin-login.html');
  });

  /* ---------- Init ---------- */
  try {
    await Promise.all([loadStats(), loadUsers(), loadContent('index')]);
  } catch (e) {
    showAlert(globalAlert, 'error', friendlyError(e));
  }
})();
</script>
</body>
</html>
