<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — LinkBio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">🔗 LinkBio</a>
  <div class="nav-links"><a class="btn btn-ghost btn-sm" href="login.html">Log in</a></div>
</nav>

<div class="auth-wrap">
  <div class="card auth-card">
    <h2 data-content="heading">Create your page</h2>
    <p data-content="subheading">It only takes a minute.</p>

    <div id="alert-box"></div>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-group">
          <input type="text" id="username" autocomplete="off" maxlength="20" required>
          <span class="input-suffix" id="username-status"></span>
        </div>
        <div class="field-hint">3–20 characters, lowercase letters, numbers, underscores only. This will be your page: linkbio.example/yourname</div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required>
        <div class="field-hint">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
    </form>

    <div class="auth-links">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  redirectIfLoggedIn();

  (async () => {
    const content = await loadSiteContent("signup", {
      heading: "Create your page",
      subheading: "It only takes a minute.",
    });
    applyTextContent(content);
  })();

  const usernameInput = document.getElementById("username");
  const statusEl = document.getElementById("username-status");
  let usernameOk = false;

  const checkUsername = debounce(async () => {
    const val = usernameInput.value.trim().toLowerCase();
    usernameInput.value = val;
    if (!isValidUsername(val)) {
      statusEl.textContent = val ? "Invalid" : "";
      statusEl.style.color = "var(--danger)";
      usernameOk = false;
      return;
    }
    statusEl.textContent = "Checking…";
    statusEl.style.color = "var(--text-dim)";
    const { data, error } = await supabase.rpc("check_username_available", { p_username: val });
    if (error) {
      statusEl.textContent = "";
      usernameOk = false;
      return;
    }
    usernameOk = !!data;
    statusEl.textContent = data ? "Available" : "Taken";
    statusEl.style.color = data ? "var(--success)" : "var(--danger)";
  }, 450);

  usernameInput.addEventListener("input", checkUsername);

  const form = document.getElementById("signup-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");
  let submitting = false;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (submitting) return;
    renderAlert(alertBox, "");

    const username = usernameInput.value.trim().toLowerCase();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (!isValidUsername(username)) {
      renderAlert(alertBox, "Please choose a valid username.");
      return;
    }
    if (!usernameOk) {
      renderAlert(alertBox, "Please choose an available username.");
      return;
    }
    if (!isValidEmail(email)) {
      renderAlert(alertBox, "Please enter a valid email address.");
      return;
    }
    if (!isValidPassword(password)) {
      renderAlert(alertBox, "Password must be at least 8 characters.");
      return;
    }
    if (password !== confirm) {
      renderAlert(alertBox, "Passwords do not match.");
      return;
    }

    submitting = true;
    setButtonLoading(submitBtn, true, "Creating account…");

    // Re-check availability right before signup to reduce (not eliminate)
    // the race window; the database UNIQUE constraint is the real guard.
    const { data: stillAvailable } = await supabase.rpc("check_username_available", { p_username: username });
    if (!stillAvailable) {
      setButtonLoading(submitBtn, false);
      submitting = false;
      renderAlert(alertBox, "That username was just taken. Please choose another.");
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: { username },
        emailRedirectTo: `${window.APP_CONFIG.SITE_URL}/login.html`,
      },
    });

    setButtonLoading(submitBtn, false);
    submitting = false;

    if (error) {
      renderAlert(alertBox, friendlyError(error));
      return;
    }

    if (data.user && !data.session) {
      renderAlert(alertBox, "Account created! Please check your email to verify your account before logging in.", "success");
      form.reset();
      statusEl.textContent = "";
    } else {
      window.location.href = "dashboard.html";
    }
  });
</script>
</body>
</html>
