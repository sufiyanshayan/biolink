<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Create account — Linkfolio</title>
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="brand">Linkfolio</a>
    <h1 class="mt-2" data-content="title">Create your account</h1>
    <p class="sub" data-content="subtitle">Claim your unique username and start sharing</p>

    <div id="alertBox" aria-live="polite"></div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label class="label" for="username">Username</label>
        <input class="input" type="text" id="username" name="username"
               autocomplete="username" required minlength="3" maxlength="30"
               pattern="[a-z0-9_]+" placeholder="yourname" />
        <small class="muted" id="unameMsg">3–30 characters. a-z, 0-9, _</small>
      </div>
      <div class="form-group">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email"
               autocomplete="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password"
               autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
      </div>
      <div class="form-group">
        <label class="label" for="confirm">Confirm password</label>
        <input class="input" type="password" id="confirm" name="confirm"
               autocomplete="new-password" required placeholder="Repeat password" />
      </div>
      <button class="btn block" type="submit" id="submitBtn" data-content="button">Create account</button>
    </form>

    <p class="text-center mt-3 muted">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const {
    sb, $, showAlert, clearAlert, setLoading, friendlyError, debounce,
    validateUsername, validateEmail, validatePassword, loadSiteContent, applyContent
  } = App;

  const alertBox = $('#alertBox');
  const form = $('#signupForm');
  const btn = $('#submitBtn');
  const uname = $('#username');
  const unameMsg = $('#unameMsg');

  const content = await loadSiteContent('signup');
  applyContent(content);

  // Live availability check
  const checkAvailability = debounce(async (raw) => {
    const v = validateUsername(raw);
    if (!v.ok) {
      unameMsg.textContent = v.msg;
      unameMsg.style.color = 'var(--danger)';
      return;
    }
    unameMsg.textContent = 'Checking availability…';
    unameMsg.style.color = 'var(--muted)';
    try {
      const { data, error } = await sb.from('profiles')
        .select('username').eq('username', v.value).limit(1);
      if (error) throw error;
      if (data && data.length) {
        unameMsg.textContent = 'Username already taken';
        unameMsg.style.color = 'var(--danger)';
      } else {
        unameMsg.textContent = 'Available ✓';
        unameMsg.style.color = 'var(--success)';
      }
    } catch (e) {
      unameMsg.textContent = 'Could not verify. Try again.';
      unameMsg.style.color = 'var(--muted)';
    }
  }, 350);

  uname.addEventListener('input', () => checkAvailability(uname.value));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);

    const u = validateUsername(uname.value);
    if (!u.ok) return showAlert(alertBox, 'error', u.msg);
    const em = validateEmail($('#email').value);
    if (!em.ok) return showAlert(alertBox, 'error', em.msg);
    const pw = validatePassword($('#password').value);
    if (!pw.ok) return showAlert(alertBox, 'error', pw.msg);
    if ($('#password').value !== $('#confirm').value)
      return showAlert(alertBox, 'error', 'Passwords do not match');

    setLoading(btn, true, 'Creating account…');
    try {
      // Pre-check username (UX only — DB has unique constraint too)
      const { data: existing } = await sb.from('profiles')
        .select('id').eq('username', u.value).limit(1);
      if (existing && existing.length) throw new Error('duplicate key username');

      const { data, error } = await sb.auth.signUp({
        email: em.value,
        password: $('#password').value,
        options: {
          data: { username: u.value },
          emailRedirectTo: `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}login.html`
        }
      });
      if (error) throw error;

      // If session exists → email confirmation is off
      if (data.session) {
        showAlert(alertBox, 'success', 'Account created! Redirecting…');
        setTimeout(() => window.location.replace('dashboard.html'), 800);
      } else {
        showAlert(alertBox, 'success',
          'Please check your email to verify your account before signing in.');
        form.reset();
      }
    } catch (err) {
      showAlert(alertBox, 'error', friendlyError(err));
    } finally {
      setLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
