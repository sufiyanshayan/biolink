<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login — LinkBio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav"><a class="brand" href="index.html">🔗 LinkBio</a></nav>

<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Admin login</h2>
    <p>Restricted access. Authorized administrators only.</p>
    <div id="alert-box"></div>
    <form id="admin-login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  (async () => {
    // If already logged in AND already an admin, skip straight to the panel.
    const session = await getSession();
    if (session) {
      const { data } = await supabase.from("admins").select("is_active").eq("user_id", session.user.id).eq("is_active", true).maybeSingle();
      if (data) window.location.href = "admin-panel.html";
    }
  })();

  const form = document.getElementById("admin-login-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    renderAlert(alertBox, "");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!isValidEmail(email) || !password) {
      renderAlert(alertBox, "Please enter a valid email and password.");
      return;
    }

    setButtonLoading(submitBtn, true, "Logging in…");
    const { data: authData, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      setButtonLoading(submitBtn, false);
      renderAlert(alertBox, friendlyError(error));
      return;
    }

    // Authorization is verified server-side against the admins table,
    // never by comparing the email address.
    const { data: adminRow } = await supabase
      .from("admins")
      .select("is_active")
      .eq("user_id", authData.user.id)
      .eq("is_active", true)
      .maybeSingle();

    setButtonLoading(submitBtn, false);

    if (!adminRow) {
      await supabase.auth.signOut();
      renderAlert(alertBox, "This account is not authorized for admin access.");
      return;
    }

    window.location.href = "admin-panel.html";
  });
</script>
</body>
</html>
