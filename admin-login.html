<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin login — Linkfolio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="brand">Linkfolio</a>
    <h1 class="mt-2">Admin sign in</h1>
    <p class="sub">Authorized personnel only.</p>

    <div id="alertBox" aria-live="polite"></div>

    <form id="adminForm" novalidate>
      <div class="form-group">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" required autocomplete="current-password" />
      </div>
      <button class="btn block" type="submit" id="submitBtn">Sign in</button>
    </form>
    <p class="text-center mt-3 muted"><a href="login.html">Regular login</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { sb, $, showAlert, clearAlert, setLoading, friendlyError, getSession, validateEmail } = App;
  const alertBox = $('#alertBox');
  const form = $('#adminForm');
  const btn = $('#submitBtn');

  // If already admin, redirect
  const existing = await getSession();
  if (existing) {
    const { data } = await sb.from('admins')
      .select('is_active').eq('user_id', existing.user.id).maybeSingle();
    if (data && data.is_active) {
      window.location.replace('admin-panel.html');
      return;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);
    const em = validateEmail($('#email').value);
    if (!em.ok) return showAlert(alertBox, 'error', em.msg);
    if (!$('#password').value) return showAlert(alertBox, 'error', 'Password required');

    setLoading(btn, true, 'Verifying…');
    try {
      const { data, error } = await sb.auth.signInWithPassword({
        email: em.value, password: $('#password').value
      });
      if (error) throw error;

      // Verify admin status via admins table (RLS allows self-read)
      const { data: adminRow, error: adminErr } = await sb.from('admins')
        .select('is_active').eq('user_id', data.user.id).maybeSingle();
      if (adminErr) throw adminErr;
      if (!adminRow || !adminRow.is_active) {
        await sb.auth.signOut();
        throw new Error('You are not authorized as an admin.');
      }
      showAlert(alertBox, 'success', 'Welcome, admin. Redirecting…');
      window.location.replace('admin-panel.html');
    } catch (err) {
      showAlert(alertBox, 'error', friendlyError(err));
      setLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
